name: Weekly Radar Guard

on:
  schedule:
    # 09:30 JST is 00:30 UTC — 30 minutes after the primary Weekly Radar
    # publish window (00:00 UTC / 09:00 JST), to give the scheduled run
    # time to complete before this checks for a published report.
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct the data tree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --no-tags origin data
            git archive origin/data -- weekly-radar | tar -x -f -
          else
            echo "No data branch exists yet; treating today's report as unpublished."
          fi

      - name: Verify today's report was published
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          as_of="$(date -u +%F)"
          published=false
          if [[ -d weekly-radar ]]; then
            verify_output="$(mktemp)"
            if cargo run --release -- weekly-radar \
              --archive-dir "$GITHUB_WORKSPACE" \
              --verify-published-as-of "$as_of" | tee "$verify_output"; then
              if grep -Fq 'ALREADY-PUBLISHED:' "$verify_output"; then
                published=true
              fi
            fi
          fi
          echo "as_of=${as_of}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"

      - name: Alert on Telegram if missing
        if: steps.verify.outputs.published == 'false'
        env:
          ORGX_TELEGRAM_BOT_TOKEN: ${{ secrets.ORGX_TELEGRAM_BOT_TOKEN }}
          ORGX_TELEGRAM_CHAT_ID: ${{ secrets.ORGX_TELEGRAM_CHAT_ID }}
          AS_OF: ${{ steps.verify.outputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          text="Weekly Radar Guard: no published report confirmed for ${AS_OF} as of 09:30 JST. The scheduled run may have failed or been skipped by GitHub Actions. Manual recovery: gh workflow run weekly-radar.yml --ref main"
          curl -sS --fail-with-body \
            "https://api.telegram.org/bot${ORGX_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${ORGX_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            >/dev/null

      - name: Fail closed when unpublished
        if: steps.verify.outputs.published == 'false'
        run: |
          echo "Weekly Radar report missing for ${{ steps.verify.outputs.as_of }}; alert sent, marking this run failed for visibility." >&2
          exit 1

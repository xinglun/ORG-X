name: Weekly Radar

on:
  schedule:
    # 09:00 JST is 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      language:
        description: Report language (default is Simplified Chinese)
        required: false
        type: choice
        options:
          - zh-CN
          - ja
          - en
        default: zh-CN
      as_of:
        description: Optional report date in YYYY-MM-DD
        required: false
        type: string
      dry_run:
        description: Validate acquisition and report without Telegram or data-branch writes
        required: false
        type: boolean
        default: false
      republish_published:
        description: Explicitly re-send the already published report without changing the archive
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-radar-data
  cancel-in-progress: false

jobs:
  weekly-radar:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct the data tree
        shell: bash
        env:
          TARGET_REF: refs/heads/data
          PENDING_REF: refs/heads/weekly-radar-pending
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == "refs/heads/data" ]]; then
            echo "Refusing to run from the data branch." >&2
            exit 1
          fi
          if [[ "$TARGET_REF" == "refs/heads/main" ]]; then
            echo "Refusing to use main as the archive target." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --no-tags origin data
            git archive origin/data -- weekly-radar | tar -x -f -
            data_as_of="$(git show origin/data:weekly-radar/manifest.json | jq -er '.as_of // empty')"
          else
            echo "No data branch exists yet; starting an empty archive tree."
            data_as_of=""
          fi

          if git ls-remote --exit-code --heads origin weekly-radar-pending >/dev/null 2>&1; then
            git fetch --no-tags origin weekly-radar-pending
            pending_manifest="$(mktemp)"
            trap 'rm -f "$pending_manifest"' EXIT
            if ! git show origin/weekly-radar-pending:weekly-radar/manifest.json >"$pending_manifest"; then
              echo "Pending publication ref has no readable manifest; refusing recovery." >&2
              exit 1
            fi
            pending_as_of="$(jq -er '.as_of // empty' "$pending_manifest")"
            if [[ ! "$pending_as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Pending publication ref has an invalid report date; refusing recovery." >&2
              exit 1
            fi
            if [[ -n "$data_as_of" && "$pending_as_of" < "$data_as_of" ]]; then
              echo "Pending publication date $pending_as_of is older than data date $data_as_of; refusing to downgrade the archive." >&2
              exit 1
            fi
            if [[ -n "$data_as_of" && "$pending_as_of" == "$data_as_of" ]] \
              && ! git diff --quiet origin/data origin/weekly-radar-pending -- weekly-radar; then
              echo "Pending publication and data archives conflict for the same date; refusing recovery." >&2
              exit 1
            fi
            git archive origin/weekly-radar-pending -- weekly-radar | tar -x -f -
            echo "Pending publication ref reconstructed for $pending_as_of."
          else
            echo "No pending publication ref exists."
          fi

      - name: Acquire, publish, and prepare the data commit
        shell: bash
        env:
          ORGX_SEC_USER_AGENT: ${{ secrets.ORGX_SEC_USER_AGENT }}
          ORGX_TELEGRAM_BOT_TOKEN: ${{ secrets.ORGX_TELEGRAM_BOT_TOKEN }}
          ORGX_TELEGRAM_CHAT_ID: ${{ secrets.ORGX_TELEGRAM_CHAT_ID }}
          REPORT_LANGUAGE: ${{ inputs.language || 'zh-CN' }}
          REPORT_AS_OF: ${{ inputs.as_of || '' }}
          REPORT_DRY_RUN: ${{ inputs.dry_run || false }}
          REPUBLISH_PUBLISHED: ${{ inputs.republish_published || false }}
        run: |
          set -euo pipefail
          run_output="$(mktemp)"
          trap 'rm -f "$run_output"' EXIT
          if [[ "$REPUBLISH_PUBLISHED" == "true" && "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]]; then
            echo "Republish is only available to explicit workflow_dispatch." >&2
            exit 1
          fi
          if [[ "$REPUBLISH_PUBLISHED" == "true" && "$REPORT_DRY_RUN" == "true" ]]; then
            echo "Republish cannot be combined with dry-run." >&2
            exit 1
          fi
          as_of="${REPORT_AS_OF:-$(date -u +%F)}"
          cli_args=(
            --as-of "$as_of"
            --archive-dir "$GITHUB_WORKSPACE"
            --registry "$GITHUB_WORKSPACE/config/weekly_radar/companies.json"
            --language "$REPORT_LANGUAGE"
          )
          if [[ "$REPORT_DRY_RUN" == "true" ]]; then
            cli_args+=(--dry-run)
          fi

          pending_as_of=""
          if git show origin/weekly-radar-pending:weekly-radar/manifest.json >/dev/null 2>&1; then
            pending_as_of="$(git show origin/weekly-radar-pending:weekly-radar/manifest.json | jq -er '.as_of // empty')"
          fi
          if [[ "$REPORT_DRY_RUN" != "true" && -n "$pending_as_of" && "$pending_as_of" > "$as_of" ]]; then
            echo "Pending publication date $pending_as_of is newer than requested date $as_of; refusing to guess ordering." >&2
            exit 1
          fi

          data_final_run=false
          if git show "origin/data:weekly-radar/reports/${as_of}.md" >/dev/null 2>&1; then
            if git show "origin/data:weekly-radar/snapshots/${as_of}.json" >/dev/null 2>&1; then
              if git show "origin/data:weekly-radar/receipts/${as_of}.json" >/dev/null 2>&1; then
                data_final_run=true
              fi
            fi
          fi
          if [[ "$REPORT_DRY_RUN" != "true" && "$data_final_run" == "true" ]]; then
            if [[ "$REPUBLISH_PUBLISHED" == "true" ]]; then
              cargo run --release -- weekly-radar \
                --republish-published-as-of "$as_of" \
                --archive-dir "$GITHUB_WORKSPACE" \
                | tee "$run_output"
              if ! grep -Fq 'REPUBLISHED:' "$run_output"; then
                echo "Weekly Radar did not report a republished delivery; refusing to claim validation." >&2
                exit 1
              fi
              echo "Weekly Radar republished existing report; archive and data branch were not changed."
              exit 0
            fi
            cargo run --release -- weekly-radar --verify-published-as-of "$as_of" --archive-dir "$GITHUB_WORKSPACE" | tee "$run_output"
            if ! grep -Fq 'ALREADY-PUBLISHED:' "$run_output"; then
              echo "Weekly Radar could not verify the existing final run; refusing to skip publication." >&2
              exit 1
            fi
            echo "Weekly Radar already published $as_of; no Telegram or data-branch write was needed."
            exit 0
          elif [[ "$REPORT_DRY_RUN" != "true" && "$REPUBLISH_PUBLISHED" == "true" ]]; then
            echo "Republish requires a complete final report on data for $as_of; refusing to acquire or publish a new run." >&2
            exit 1
          elif [[ "$REPORT_DRY_RUN" != "true" && -n "$pending_as_of" && "$pending_as_of" == "$as_of" ]]; then
            cargo run --release -- weekly-radar \
              --recover-published-as-of "$pending_as_of" \
              --archive-dir "$GITHUB_WORKSPACE" \
              | tee "$run_output"
          else
            cargo run --release -- weekly-radar "${cli_args[@]}" \
              | tee "$run_output"
          fi

          if [[ ! -s "$run_output" ]]; then
            echo "Weekly Radar produced empty output; refusing to update data." >&2
            exit 1
          fi
          if [[ "$REPORT_DRY_RUN" == "true" ]]; then
            if ! grep -Fq 'DRY-RUN:' "$run_output"; then
              echo "Weekly Radar dry-run did not report validation; refusing to continue." >&2
              exit 1
            fi
            echo "Weekly Radar dry-run completed; Telegram and data branch were not contacted."
            exit 0
          fi
          if ! grep -Fq 'PUBLISHED:' "$run_output" && ! grep -Fq 'READY-TO-PUSH:' "$run_output" && ! grep -Fq 'RECOVERED:' "$run_output"; then
            echo "Weekly Radar did not report a published or recoverable run; refusing to update data." >&2
            exit 1
          fi
          if [[ ! -d weekly-radar/reports ]] || ! find weekly-radar/reports -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "Weekly Radar report output is missing; refusing to update data." >&2
            exit 1
          fi
          # The runtime applies the approved 365-day rolling retention before
          # it writes this report, snapshot, and receipt set.
          if [[ ! -d weekly-radar/reports/ ]]; then
            echo "weekly-radar/reports/ is missing after publication." >&2
            exit 1
          fi

          target_ref="refs/heads/data"
          if [[ "$target_ref" == "refs/heads/main" ]]; then
            echo "Protected target guard rejected main." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . >/dev/null 2>&1
          git add -- weekly-radar
          if git diff --cached --quiet; then
            echo "No data files are staged; refusing to create an empty update." >&2
            exit 1
          fi
          git commit -m "data: weekly radar $(date -u +%F)"

          pending_tip="$(git ls-remote --heads origin weekly-radar-pending | awk '{print $1}')"
          if ! git push --force-with-lease=refs/heads/weekly-radar-pending:${pending_tip} origin HEAD:refs/heads/weekly-radar-pending; then
            echo "Pending publication ref push failed after Telegram acceptance; refusing to send again and requiring human recovery." >&2
            exit 1
          fi

          data_tip="$(git ls-remote --heads origin data | awk '{print $1}')"
          if ! git push --force-with-lease=refs/heads/data:${data_tip} origin HEAD:refs/heads/data; then
            echo "Data branch push failed after the pending publication ref was retained; concurrent or protected-branch update detected, and the next run will verify and reuse the original receipt." >&2
            exit 1
          fi

          if ! git push origin --delete weekly-radar-pending; then
            echo "Data branch is published, but pending publication cleanup failed; the next run will compare identities before cleanup." >&2
          fi

[package]
name = "org-x"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ORG-X production-system transformation research foundation"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "org-x"
path = "src/main.rs"

[[test]]
name = "dependency_rules"
path = "tests/architecture/dependency_rules.rs"

[[test]]
name = "module_boundaries"
path = "tests/architecture/module_boundaries.rs"

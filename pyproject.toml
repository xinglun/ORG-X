[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
show_error_codes = true
warn_unused_configs = true
follow_imports = "normal"

[tool.coverage.run]
data_file = "target/.coverage"

[tool.coverage.paths]
source = [
    "scripts",
    "*/scripts",
]

[tool.coverage.report]
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
